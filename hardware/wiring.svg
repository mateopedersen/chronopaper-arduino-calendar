<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">ChronoPaper wiring reference</title><desc id="desc">Proposed 3.3 volt wiring between Arduino Nano ESP32, Good Display DESPI-C02 adapter, GDEY042T81 e-paper, DS3231 RTC, and three buttons.</desc>
<rect width="1500" height="940" fill="#f4f2eb"/><text x="64" y="70" font-family="Arial" font-size="36" font-weight="700" fill="#17202b">CHRONOPAPER / PROPOSED WIRING</text><text x="64" y="108" font-family="Arial" font-size="19" fill="#596673">Reference for named parts only · verify adapter silkscreen and exact panel revision before power</text>
<rect x="72" y="180" width="390" height="590" rx="22" fill="#d7eadc" stroke="#315c43" stroke-width="4"/><text x="110" y="230" font-family="Arial" font-size="28" font-weight="700">Arduino Nano ESP32</text><text x="110" y="267" font-family="Arial" font-size="18">3.3 V logic · default Arduino pin numbering</text>
<g font-family="Arial" font-size="21" fill="#17202b"><text x="110" y="345">D11 / COPI (MOSI)</text><text x="110" y="395">D13 / SCK</text><text x="110" y="445">D10 / CS</text><text x="110" y="495">D9 / D-C</text><text x="110" y="545">D8 / RESET</text><text x="110" y="595">D7 / BUSY</text><text x="110" y="655">A4 / SDA</text><text x="110" y="700">A5 / SCL</text><text x="110" y="745">3V3 / GND</text></g>
<rect x="575" y="220" width="360" height="420" rx="18" fill="#e3e8ec" stroke="#4b6474" stroke-width="4"/><text x="617" y="270" font-family="Arial" font-size="26" font-weight="700">DESPI-C02 adapter</text><text x="617" y="306" font-family="Arial" font-size="18">Check connector orientation / pin labels</text><g font-family="Arial" font-size="20" fill="#17202b"><text x="617" y="365">SDI / MOSI · SCK</text><text x="617" y="410">CS · D/C · RES · BUSY</text><text x="617" y="455">3.3 V · GND</text><text x="617" y="520">24-pin 0.5 mm FPC</text><text x="617" y="570">Panel: GDEY042T81</text><text x="617" y="605">400 × 300 · SSD1683</text></g>
<rect x="1070" y="218" width="345" height="200" rx="18" fill="#fff" stroke="#777" stroke-width="3"/><text x="1110" y="265" font-family="Arial" font-size="24" font-weight="700">Optional DS3231 RTC</text><text x="1110" y="315" font-family="Arial" font-size="19">SDA → A4 · SCL → A5</text><text x="1110" y="355" font-family="Arial" font-size="19">VCC → 3V3 · GND → GND</text><text x="1110" y="392" font-family="Arial" font-size="16" fill="#6b3030">3.3 V-compatible pull-ups only</text>
<rect x="1070" y="480" width="345" height="250" rx="18" fill="#fff" stroke="#777" stroke-width="3"/><text x="1110" y="530" font-family="Arial" font-size="24" font-weight="700">Buttons (to GND)</text><text x="1110" y="580" font-family="Arial" font-size="19">Previous: D2 · Next: D3</text><text x="1110" y="625" font-family="Arial" font-size="19">View: D4 (hold: week start)</text><text x="1110" y="680" font-family="Arial" font-size="16">Internal pull-ups enabled in firmware</text>
<g fill="none" stroke="#267b59" stroke-width="5"><path d="M462 340 H515 V360 H575"/><path d="M462 390 H535 V390 H575"/><path d="M462 440 H545 V420 H575"/><path d="M462 490 H555 V435 H575"/><path d="M462 540 H540 V450 H575"/><path d="M462 590 H525 V465 H575"/><path d="M462 745 H515 V490 H575"/></g>
<g fill="none" stroke="#2566a5" stroke-width="5"><path d="M462 655 H980 V315 H1070"/><path d="M462 700 H1000 V340 H1070"/><path d="M462 745 H1020 V365 H1070"/></g>
<g fill="none" stroke="#a36c28" stroke-width="4" stroke-dasharray="9 9"><path d="M462 345 H490 V780 H1070 V580"/><path d="M462 345 H480 V800 H1070 V625"/><path d="M462 745 H500 V820 H1070 V655"/></g>
<rect x="72" y="830" width="1340" height="64" rx="12" fill="#fff0df" stroke="#bb6e1e" stroke-width="2"/><text x="100" y="870" font-family="Arial" font-size="22" font-weight="700" fill="#753e13">POWER SAFETY: 3.3 V ONLY on panel and signals. Never connect 5 V to the Nano ESP32 GPIO or e-paper adapter.</text>
<text x="580" y="690" font-family="Arial" font-size="15" fill="#267b59">SPI (green)</text><text x="880" y="690" font-family="Arial" font-size="15" fill="#2566a5">I²C (blue)</text><text x="880" y="716" font-family="Arial" font-size="15" fill="#a36c28">Button / shared power guides (dashed)</text></svg>
